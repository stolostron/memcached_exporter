name: Tests

on:
  pull_request:
    branches:
      - master
      - main
      - release-*

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      memcached:
        image: memcached
        ports:
          - 11211:11211
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'

      - name: Build binary
        run: make build

      - name: Run tests
        run: make test
